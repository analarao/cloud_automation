# This is your single source of truth for all variables

# Define all service connection details here
services:
  alertmanager:
    host: "prometheus-kube-prometheus-alertmanager.monitoring.svc.cluster.local"
    port: "9093"
    extras: "/api/v2/alerts"
  prometheus:
    host: "prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local"
    port: "9090"
  grafana:
    host: "prometheus-grafana.monitoring.svc.cluster.local"
    port: "3000"
  loki:
    host: "loki.monitoring.svc.cluster.local"
    port: "3100"
  # CB Model (vLLM) - gRPC interface for LLM completions
  # Services can use this for MCP command execution
  cbModel:
    host: "cb-model-service"
    grpcPort: "50051"
    httpPort: "8000"

  

csModel:
  enabled: true
  image: chandrashekar316/capstone:cs_model
  deployment:
    name: cs-model-deployment  
  service:
    name: cs-model-service
    port: 9001

grpcServer:
  enabled: true
  image: chandrashekar316/capstone:grpc_server
  deployment:
    name: grpc-server-deployment
  service:
    name: grpc-server-service
    port: 60065

grpcClient:
  enabled: true
  image: chandrashekar316/capstone:grpc_client
  deployment:
    name: grpc-client-deployment

# =============================================================================
# CB (Container-Brain): Local LLM with vLLM + gRPC Interface
# =============================================================================
# This is the AI Decision Engine for the Autonomous Operations Platform.
# It runs a local LLM via vLLM and exposes a gRPC interface for other services
# (AlertManager, CS Model) to request completions/MCP command execution.
# =============================================================================

cbModel:
  enabled: true
  replicas: 1
  
  # --- Docker Image Configuration ---
  image:
    # Image with vLLM + tool calling support
    # Use cb_model-toolcall for Phase 1+ (tool calling enabled)
    # Use cb_model-slim for legacy gRPC-only mode
    repository: chandrashekar316/capstone
    tag: cb_model-toolcall
    pullPolicy: Always
  
  deployment:
    name: cb-model-deployment
  
  # --- Service Configuration ---
  service:
    name: cb-model-service
    type: ClusterIP
    # HTTP port for OpenAI-compatible API (with tool calling)
    httpPort: 8000
    # gRPC port for backward compatibility (Phase 3)
    grpcPort: 50051
  
  # ServiceAccount for RBAC (MCP server needs kubectl access)
  serviceAccountName: "cb-model-sa"
  
  # ==========================================================================
  # TOOL CALLING CONFIGURATION (Phase 1)
  # ==========================================================================
  # Enables vLLM's native tool calling via OpenAI-compatible API.
  # Qwen2.5-Coder models use Hermes-style tool calling format.
  # ==========================================================================
  toolCalling:
    enabled: true
    # Tool call parser: hermes (for Qwen2.5), llama3_json, mistral, etc.
    parser: "hermes"
  
  # ==========================================================================
  # MCP CONFIGURATION (Phase 2)
  # ==========================================================================
  # MCP server (mcp-server-kubernetes) embedded in CB pod.
  # Provides kubectl operations via MCP protocol.
  # ==========================================================================
  mcp:
    enabled: true
    # Target namespace for MCP kubernetes operations (RBAC scoped)
    targetNamespace: "target-services"
    # Enable non-destructive mode (read + create/update only, no delete)
    nonDestructive: false
  
  # ==========================================================================
  # GRPC BRIDGE CONFIGURATION (Phase 2)
  # ==========================================================================
  # gRPC bridge connects alert aggregator to vLLM+MCP orchestrator.
  # Enable this for production deployments where alerts come via gRPC.
  # ==========================================================================
  grpcBridge:
    enabled: false  # Set to true to enable gRPC bridge
    port: 50051
    maxIterations: 10  # Max LLM reasoning iterations per alert

  # ==========================================================================
  # MODEL CONFIGURATION - Edit this section to change the LLM model
  # ==========================================================================
  model:
    # -------------------------------------------------------------------------
    # LOCAL MODEL OPTIONS (change 'name' to switch models):
    # -------------------------------------------------------------------------
    # Small models (< 4GB VRAM):
    #   - "TinyLlama/TinyLlama-1.1B-Chat-v1.0" (max_len: 2048)
    #   - "microsoft/phi-2" (max_len: 2048)
    #   - "Qwen/Qwen2-1.5B-Instruct" (max_len: 32768)
    #
    # Medium models (8-16GB VRAM):
    #   - "Qwen/Qwen2.5-Coder-7B-Instruct" (max_len: 32768)
    #   - "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ" (max_len: 32768)
    #
    # Large models (20-24GB VRAM) - AWQ quantized:
    #   - "Qwen/Qwen2.5-Coder-32B-Instruct-AWQ" (max_len: 32768, tool calling)
    #     WARNING: 32B needs ~18GB for weights, very tight on 24GB GPU
    # -------------------------------------------------------------------------
    # Using 14B model - fits comfortably on 24GB GPU with room for KV cache
    name: "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ"
    
    # Maximum context length (tokens)
    # 14B AWQ model: 8192 is safe on 24GB, can try 16384
    # 32B AWQ model: 2048-4096 max on 24GB (very tight)
    maxModelLen: "8192"
    
    # Data type: auto, half, float16, bfloat16
    dtype: "auto"
    
    # Quantization: awq for AWQ models, gptq, squeezellm, or empty for none
    quantization: "awq"
    
    # Max concurrent sequences (lower = less memory)
    # Default is 256, reduce to 32-64 for memory-constrained setups
    maxNumSeqs: "64"
    
    # Extra vLLM arguments (array of strings)
    extraArgs: []

  # ==========================================================================
  # SYSTEM PROMPT CONFIGURATION
  # ==========================================================================
  # This is the default system prompt sent to the LLM for all requests.
  # It sets the context and role for the AI decision engine.
  # You can override this per-request via the gRPC call.
  # ==========================================================================
  systemPrompt: |
    You are CB (Container-Brain), an expert SRE and DevOps AI assistant for the Autonomous Operations Platform.
    Your role is to analyze alerts, diagnose issues, and generate MCP (Model Context Protocol) commands for remediation.
    
    When analyzing an alert:
    1. Parse the alert context including metrics, logs, and service topology
    2. Identify the root cause based on the symptoms
    3. Query your knowledge of past incidents and successful remediations
    4. Generate a structured remediation plan using MCP commands
    
    Available MCP Toolkits:
    - Orchestration: kubectl commands, deployment rollbacks, scaling, network policies
    - Application: cache clearing, service restarts, configuration updates
    - Infrastructure: cloud provider API calls, firewall rules, load balancer config
    
    Always respond with actionable MCP commands in JSON format when remediation is needed.
    Be concise and focus on the most likely root cause first.

  # --- NVIDIA GPU Configuration ---
  gpu:
    enabled: true
    # Number of GPUs to use
    count: 1
    # GPU memory utilization (0.0-1.0)
    # NOTE: For 32B AWQ model, we need ~0.92 to have enough for model + KV cache
    # Model weights = 18.1 GiB, need ~2 GiB for KV cache at 4096 context
    memoryUtilization: "0.90"
    # Tensor parallel size (for multi-GPU setups)
    tensorParallelSize: "1"
    # Enforce eager mode (disables CUDA graphs) - saves ~1GB memory but slower
    # Set to false for 14B model (has enough headroom)
    enforceEager: "false"
  
  # --- Storage for model cache ---
  storage:
    size: "50Gi"
    # storageClass: ""  # Set if you need a specific storage class
  
  # Shared memory size for model loading
  shmSize: "4Gi"
  
  # --- Resource Configuration ---
  # Note: No hard memory limits - let the GPU manage memory
  resources:
    requests:
      cpu: "2"
      # Memory request only, no limit
      memory: "8Gi"
    limits:
      cpu: "8"
      # GPU limit
      nvidia.com/gpu: "1"
  
  # --- Health Check Configuration ---
  healthCheck:
    enabled: true
    initialDelaySeconds: 180
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5
  
  # --- HuggingFace Token (for gated models like Llama) ---
  huggingfaceSecret:
    enabled: false
    name: "hf-token-secret"
    key: "token"
    # Set your token: kubectl create secret generic hf-token-secret --from-literal=token=YOUR_TOKEN -n monitoring
  
  # --- Node Selector for GPU nodes ---
  nodeSelector:
    nvidia.com/gpu.present: "true"
  
  # --- Tolerations for GPU nodes ---
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  
  # --- Additional environment variables ---
  env:
    CUDA_VISIBLE_DEVICES: "0"

# =============================================================================
# Alert Context Aggregator
# =============================================================================
# Receives alerts from AlertManager, aggregates context from Prometheus,
# Kiali, Loki, and K8s API, then forwards enriched context to CB Model LLM.
# =============================================================================

alertAggregator:
  enabled: true
  replicas: 1
  
  image:
    repository: chandrashekar316/capstone
    tag: alert_aggregator
    pullPolicy: Always
  
  deployment:
    name: alert-aggregator-deployment
  
  service:
    name: alert-aggregator-service
    type: ClusterIP
    port: 9095
  
  # Service account for K8s API access
  serviceAccountName: "alert-aggregator-sa"
  
  # Kiali configuration
  kiali:
    url: "http://kiali.istio-system.svc.cluster.local:20001"
    # Optional: Set if Kiali requires authentication
    # username: "admin"
    # secretName: "kiali-credentials"
  
  # Query settings
  metricsLookbackMinutes: 30
  logsLookbackMinutes: 15
  maxLogLines: 100
  
  # Timeouts
  grpcTimeoutSeconds: 120
  queryTimeoutSeconds: 30
  
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# =============================================================================
# Alert Server (Alert Remediation - Server Component)
# =============================================================================
# Receives alerts from AlertManager webhook, enriches context from
# Prometheus, Kiali, Loki, K8s API, and sends to Gemini client via gRPC.
# =============================================================================

alertServer:
  enabled: true
  replicas: 1
  
  image:
    repository: chandrashekar316/capstone
    tag: alert_server
    pullPolicy: Always
  
  deployment:
    name: alert-server-deployment
  
  service:
    name: alert-server-service
    type: ClusterIP
    port: 9095
  
  # Service account for K8s API access
  serviceAccountName: "alert-server-sa"
  
  # Kiali configuration
  kiali:
    url: "http://kiali.istio-system.svc.cluster.local:20001"
  
  # Query settings
  metricsLookbackMinutes: 30
  logsLookbackMinutes: 15
  maxLogLines: 100
  
  # Timeouts
  grpcTimeoutSeconds: 300  # Long timeout for Gemini processing
  queryTimeoutSeconds: 30
  
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# =============================================================================
# Gemini Client (Alert Remediation - Client Component)
# =============================================================================
# Receives enriched alerts via gRPC, calls Google Gemini API with
# MCP-style tool calling for Kubernetes operations, executes remediation.
# =============================================================================

geminiClient:
  enabled: true
  replicas: 1
  
  image:
    repository: chandrashekar316/capstone
    tag: gemini_client
    pullPolicy: Always
  
  deployment:
    name: gemini-client-deployment
  
  service:
    name: gemini-client-service
    type: ClusterIP
    port: 50051
  
  # Service account for kubectl operations
  serviceAccountName: "gemini-client-sa"
  
  # Gemini API configuration
  # API key stored in secret: kubectl create secret generic gemini-api-key --from-literal=api-key=YOUR_KEY -n monitoring
  apiKeySecret: "gemini-api-key"
  geminiModel: "gemini-1.5-pro"
  geminiTemperature: 0.1
  
  # MCP/Kubernetes settings
  targetNamespace: "target-services"
  nonDestructive: false  # Set to true to block write operations
  maxIterations: 10
  
  # gRPC settings
  grpcMaxWorkers: 10
  
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
