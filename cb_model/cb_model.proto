syntax = "proto3";

package cb_model;

// CB (Container-Brain) LLM Service
// This service provides gRPC interface for LLM completions
// Used by AlertManager, CS Model, and other services for MCP command execution
service CBModelService {
    // Generate a completion from the LLM
    // The prompt can be an MCP command, alert context, or any text
    rpc GenerateCompletion(CompletionRequest) returns (CompletionResponse) {}
    
    // Stream completion tokens as they're generated
    rpc StreamCompletion(CompletionRequest) returns (stream CompletionChunk) {}
    
    // Check if the model is ready to serve requests
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse) {}
    
    // Get information about the loaded model
    rpc GetModelInfo(ModelInfoRequest) returns (ModelInfoResponse) {}
}

// Request for completion generation
message CompletionRequest {
    // The prompt text to send to the LLM
    // This can be:
    // - Raw text prompt
    // - Serialized MCP command (will be interpreted as prompt)
    // - Alert context with instructions
    string prompt = 1;
    
    // Optional: System prompt to set context for the LLM
    string system_prompt = 2;
    
    // Maximum tokens to generate
    int32 max_tokens = 3;
    
    // Temperature for sampling (0.0 = deterministic, 1.0 = creative)
    float temperature = 4;
    
    // Top-p nucleus sampling
    float top_p = 5;
    
    // Request identifier for tracking
    string request_id = 6;
    
    // Source of the request (e.g., "alertmanager", "cs_model", "mcp_executor")
    string source = 7;
    
    // Optional: Additional metadata as key-value pairs
    map<string, string> metadata = 8;
}

// Response containing the full completion
message CompletionResponse {
    // The generated completion text
    string completion = 1;
    
    // Request ID echoed back
    string request_id = 2;
    
    // Number of tokens in the prompt
    int32 prompt_tokens = 3;
    
    // Number of tokens generated
    int32 completion_tokens = 4;
    
    // Total tokens used
    int32 total_tokens = 5;
    
    // Time taken for generation in milliseconds
    int64 generation_time_ms = 6;
    
    // Model used for generation
    string model_name = 7;
    
    // Finish reason: "stop", "length", "error"
    string finish_reason = 8;
}

// Streaming chunk for incremental completion
message CompletionChunk {
    // Token or partial text
    string text = 1;
    
    // Is this the final chunk?
    bool is_final = 2;
    
    // Request ID
    string request_id = 3;
    
    // Chunk index
    int32 chunk_index = 4;
}

// Health check request
message HealthCheckRequest {}

// Health check response
message HealthCheckResponse {
    // Is the service healthy and ready?
    bool healthy = 1;
    
    // Is the model loaded?
    bool model_loaded = 2;
    
    // Status message
    string status = 3;
    
    // GPU memory usage percentage (if applicable)
    float gpu_memory_usage = 4;
}

// Model info request
message ModelInfoRequest {}

// Model info response
message ModelInfoResponse {
    // Name of the loaded model
    string model_name = 1;
    
    // Maximum context length
    int32 max_context_length = 2;
    
    // Model dtype
    string dtype = 3;
    
    // GPU being used
    string gpu_info = 4;
    
    // Quantization type (if any)
    string quantization = 5;
}
